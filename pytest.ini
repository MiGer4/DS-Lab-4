[pytest]
# Specify directories and files containing tests
testpaths = tests

# Specify patterns for finding test files
python_files = test_*.py *_test.py

# Specify patterns for finding test functions
python_functions = test_*

# Settings for more detailed output of results
addopts = --tb=short --maxfail=5
log_cli = true
log_cli_level = INFO

# Ignore specific directories
norecursedirs = dist build .tox .git __pycache__

# Add path to project root directory
pythonpath = .
